<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SB BRAND SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="lang.js"></script>
    <style>
        .cart-page { padding: 0 15px 15px; max-width: 600px; margin: 0 auto; }
        .cart-item { display: flex; align-items: center; gap: 12px; background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .cart-item-info { flex: 1; }
        .cart-item-info h4 { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .cart-item-info .item-price { font-size: 14px; color: #d9534f; font-weight: bold; }
        .qty-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #ddd; background: #f5f5f5; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; line-height: 1; transition: 0.2s; }
        .qty-btn:hover { background: #006643; color: white; border-color: #006643; }
        .qty-num { font-weight: bold; font-size: 16px; min-width: 20px; text-align: center; }
        .remove-btn { background: none; border: none; cursor: pointer; color: #d9534f; font-size: 18px; padding: 5px; }
        .cart-summary { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .summary-row { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 10px; }
        .summary-total { font-size: 17px; font-weight: bold; color: #006643; border-top: 1.5px solid #eee; padding-top: 12px; display: flex; justify-content: space-between; }
        .checkout-btn { width: 100%; padding: 15px; background: #006643; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .checkout-btn:hover { background: #004d33; }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 70px; color: #ddd; display: block; margin-bottom: 15px; }
        .empty-state p { color: #999; margin-bottom: 20px; font-size: 16px; }
        .shop-link { display: inline-block; background: #006643; color: white; padding: 12px 25px; border-radius: 10px; text-decoration: none; font-weight: bold; }

    </style>
</head>
<body>
    <header class="top-header">
        <div class="logo" data-i18n="cartTitle">🛒 My Cart</div>
    </header>

    <div class="cart-page" id="cartContainer"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span data-i18n="navHome">Home</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-clapperboard"></i><span data-i18n="navReels">Reels</span></a>
        <a href="cart.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span data-i18n="navCart">Cart</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span data-i18n="navProfile">Profile</span></a>
    </nav>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const { t, applyI18n, initShopLang } = window.APP_I18N;
        applyI18n();

        function getCart() { return JSON.parse(localStorage.getItem('sb_cart') || '[]'); }
        function saveCart(c) { localStorage.setItem('sb_cart', JSON.stringify(c)); render(); }

        function render() {
            const cart = getCart();
            const box = document.getElementById('cartContainer');

            if (cart.length === 0) {
                box.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <p>${t('cartEmpty')}</p>
                        <a href="index.html" class="shop-link">${t('startShopping')}</a>
                    </div>`;
                return;
            }

            let total = 0;
            let html = '';
            cart.forEach((item, i) => {
                total += item.price * item.quantity;
                html += `
                <div class="cart-item">
                    <img src="${item.imageUrl || 'https://via.placeholder.com/70'}" alt="${item.name}">
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <div class="item-price">৳${item.price}</div>
                        <div class="qty-row">
                            <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
                            <span class="qty-num">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${i})"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });

            const itemCount = cart.length;
            box.innerHTML = html + `
            <div class="cart-summary">
                <div class="summary-row"><span>${t('totalItems')}</span><span>${itemCount}</span></div>
                <div class="summary-row"><span>${t('deliveryRow')}</span><span style="color:#006643">${cart.length && cart.every(item => item.freeDelivery === true) ? t('free') : t('checkoutDelivery')}</span></div>
                <div class="summary-total"><span>${t('grandTotal')}</span><span>৳${total}</span></div>
                <button class="checkout-btn" onclick="goToOrderForm()">
                    <i class="fa-solid fa-bag-shopping"></i> ${t('cartOrderBtn')}
                </button>
            </div>`;
        }

        window.changeQty = function(i, d) {
            const c = getCart();
            c[i].quantity += d;
            if (c[i].quantity <= 0) c.splice(i, 1);
            saveCart(c);
        };
        window.removeItem = function(i) {
            const c = getCart();
            c.splice(i, 1);
            saveCart(c);
        };
        window.goToOrderForm = function() {
            if (!getCart().length) return;
            window.location.href = 'order.html?cart=1';
        };

        await initShopLang(async () => {
            const snap = await getDoc(doc(db, 'settings', 'general'));
            return snap.exists() ? snap.data() : null;
        });
        render();
    </script>
</body>
</html>
